# OPTIONAL template — copy to .github/workflows/pages.yml ONLY if you switch
# Settings → Pages → Source to "GitHub Actions".
#
# The repository as published uses "Deploy from a branch" (branch `main`,
# folder `/ (root)`), which needs no workflow at all. See
# https://docs.github.com/en/pages/getting-started-with-github-pages/configuring-a-publishing-source-for-your-github-pages-site
name: Deploy static site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependency (jsdom, tests only)
        run: npm install --no-save jsdom
      - name: Deterministic checks
        run: |
          node tools/review-test.mjs
          node tools/hit-model-test.mjs
          node tools/reviews-feed-test.mjs
          node tools/page-render-test.mjs
          node tools/link-check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
